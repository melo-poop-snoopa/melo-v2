[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "melo-v2-lms"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.7",
    "google-cloud-kms>=3.0",
    "onvif-zeep-async>=0.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "boto3>=1.35",
    "ultralytics>=8.3",
    "av>=12.0",
    "Pillow>=10.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "inotify_simple>=1.3; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.scripts]
lms = "lms.main:main"
melo-setup = "setup.app:main"

[tool.hatch.build.targets.wheel]
packages = ["lms", "setup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
